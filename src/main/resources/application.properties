springdoc.swagger-ui.path=/swagger-ui

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:kkikki;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:kkikki.exchange}
app.rabbitmq.queue=${RABBITMQ_QUEUE:kkikki.queue}
app.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:kkikki.key}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kkikki}

jwt.secret=${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

app.ai-analysis.scheduler.enabled=${AI_ANALYSIS_SCHEDULER_ENABLED:false}
