springdoc.swagger-ui.path=/swagger-ui

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:kkikki.exchange}
app.rabbitmq.queue=${RABBITMQ_QUEUE:kkikki.queue}
app.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:kkikki.key}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kkikki}

jwt.secret=${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

app.ai-analysis.scheduler.enabled=${AI_ANALYSIS_SCHEDULER_ENABLED:false}
