spring.application.name=demo

# ===== JWT =====
jwt.secret=${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes}
jwt.access-token-exp-minutes=${JWT_ACCESS_TOKEN_EXP_MINUTES:30}
jwt.refresh-token-exp-days=${JWT_REFRESH_TOKEN_EXP_DAYS:14}

# ===== RabbitMQ (local, guest) =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ===== RabbitMQ test message route =====
app.rabbitmq.exchange=${RABBITMQ_TEST_EXCHANGE:test.exchange}
app.rabbitmq.request-queue=${RABBITMQ_TEST_REQUEST_QUEUE:test.request.queue}
app.rabbitmq.request-routing-key=${RABBITMQ_TEST_REQUEST_ROUTING_KEY:test.request}

# ===== Redis (local) =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
